<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="css/style.css">
   <script src="https://kit.fontawesome.com/63b33233be.js" crossorigin="anonymous"></script>
   <title>Уроки игры на гитаре</title>
   <meta name="description" content="Лучший репетитор игры на гитаре в москве">
</head>
<body>
   <!-- Первая секция -->
   <section class="main-section"> 
      <div class="container main-section__nav-container">
         <!-- Навигационное меню -->
         <header class="main-section__header">
            <a href="#"><img src="/src/img/лого.png" alt=""></a>
         </header>
         <nav class="main-section__nav nav-menu">
            <ul class="nav-menu__list">
               <li class="nav-menu__list-item">Обо мне</li>
               <li class="nav-menu__list-item">Занятия</li>
               <li class="nav-menu__list-item">Запись</li>
            </ul>
         </nav>
      </div>
      <div class="container main-section__content-container">
         <!-- Левая часть первой секции -->
          <div class="left-wrapper">
            <img src="/src/img/Фото гитариста.png" alt="" class="left-wrapper__img">
            <div class="left-wrapper__rectangle-blue"></div>
            <div class="left-wrapper__rectangle-orange"></div>
            <div class="left-wrapper__rectangle-grey"></div>
         </div>
         <div class="right-wrapper">
            <div class="right-wrapper__icons-box icons">
               <div class="icons__item">
                  <i class="fa-brands fa-skype"></i>
               </div>
               <div class="icons__item">
                  <i class="fa-brands fa-vk"></i>
               </div>
               <div class="icons__item">
                  <i class="fa-brands fa-telegram"></i>
               </div>
               <div class="icons__item">
                  <i class="fa-brands fa-instagram"></i>
               </div>
            </div>
            
            <h1 class="right-wrapper_title title">Я Виктор
               <hr class="title__hr">
            </h1>
            
            <p class="right-wrapper__text">Репетитор игры на гитаре с семилетним опытом преподования </p>
               <div class="right-wrapper__button buttons">
               <button class="buttons__main-btn">Забронировать 
               <br>урок</button>
               <div class="right-wrapper__icon-btn 
               buttons__icon-btn">
                  
                  <img src="/src/img/Иконка чата 1.svg" alt="chat">
                  <p class="buttons__text">Есть <br>вопросы?</p>
               </div>
            </div>
         </div>
         <div class="main-section__first-elipse elipse">
            <div class="elipse__subtract"></div>
         </div>
      </div>
      <div class="main-section__second-elipse elipse elipse_big">
         <div class="elipse__subtract elipse__subtract_diig"></div>
      </div>
   </section>

   <!-- Вторая секция -->

   <section class="second-section">
      <div class="container second-section__container">
         <h2 class="second-section__text title">
            <hr class="title__hr"> Преподаю
         </h2>
         <div class="second-section__card-box">
            <div class="second-section__card-item cards-item">
               <img class="cards-item__img" src="/src/img/Электро-гитара 1.png" alt="электро гитара">
               <p class="cards-item__text">Электро
                  гитара
               </p>
            </div>
         </div>
      </div>
   </section>
</body>
</html>
